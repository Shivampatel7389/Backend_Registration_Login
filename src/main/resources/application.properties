server.port=${PORT:8080}

# Database Configuration (Supports Aiven Cloud MySQL & Local MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://your-aiven-host.aivencloud.com:port/defaultdb?sslMode=REQUIRED&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:your_db_username}
spring.datasource.password=${DB_PASSWORD:your_db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (256-bit Hex Key)
jwt.secret=${JWT_SECRET:your_256_bit_secret_key_here}
jwt.expiration=86400000
jwt.cookie.name=jwt_token
jwt.cookie.max-age=86400
jwt.cookie.secure=false
jwt.cookie.same-site=Lax

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*}

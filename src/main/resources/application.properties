server.port=${PORT:8080}

# Database Configuration (Aiven Cloud MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-3fb39daf-loginpage.d.aivencloud.com:15184/defaultdb?sslMode=REQUIRED&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
